name: Edge Gate Agent CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'task-*/**'

permissions:
  contents: read

jobs:
  edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tmc-system
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tmc-system/**/pom.xml
      - name: Run Edge unit and SQLite integration tests
        run: mvn -B -ntp -pl edge-gate-agent -am test
