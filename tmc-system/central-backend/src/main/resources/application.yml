# PHỤ TRÁCH: Task 8. Secrets from environment; migrations owned by each module.
spring:
  application:
    name: tmc-central
  datasource:
    url: ${TMC_DB_URL:jdbc:postgresql://localhost:5432/tmc}
    username: ${TMC_DB_USER:}
    password: ${TMC_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
