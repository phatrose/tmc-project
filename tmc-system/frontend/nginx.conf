# PHỤ TRÁCH: Task 8. Dev Compose loopback HTTP; production đặt sau TLS ingress.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
        proxy_pass http://central:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    # CONFIG-06: /edge/v1/* yêu cầu mTLS chứng thư số định danh từng Kiosk (SAN URI urn:tmc:kiosk:...).
    # KHÔNG proxy chung /edge/v1/* qua Nginx web dùng chung (sẽ khiến mọi trình duyệt kế thừa cert 1 kiosk).
    # Mỗi Kiosk kết nối trực tiếp tới Edge Gate Agent HttpsServer (mTLS client cert riêng của Kiosk).
    location /edge/v1/ {
        default_type application/json;
        return 403 '{"code":"KIOSK_MTLS_REQUIRED","message":"Direct Kiosk mTLS connection to Edge Gate Agent is required; shared web proxy is disabled."}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
